name: CF-001 Infrastructure Gate

on:
  push:
    branches:
      - feat/cf-001-coordinated-omission
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf001-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Toolchain evidence
        run: |
          go version
          docker version
          docker compose version

      - name: Verify module closure
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run Go race suite
        run: go test -race ./...

      - name: Validate Compose model
        run: make compose-check

      - name: Start lab and run smoke checks
        run: make lab-smoke

      - name: Verify Prometheus sees the SUT target as healthy
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          endpoint = "http://127.0.0.1:19090/api/v1/targets"
          deadline = time.monotonic() + 15
          last_payload = None

          while time.monotonic() < deadline:
              with urllib.request.urlopen(endpoint, timeout=5) as response:
                  last_payload = json.load(response)

              targets = last_payload["data"]["activeTargets"]
              sut = [
                  target
                  for target in targets
                  if target.get("labels", {}).get("job") == "collapselab-sut"
              ]

              if len(sut) == 1 and sut[0]["health"] == "up":
                  assert sut[0]["scrapeUrl"] == "http://sut-lab:8080/metrics", sut[0]
                  break

              time.sleep(0.5)
          else:
              raise AssertionError(
                  "SUT target did not become healthy within 15s: "
                  + json.dumps(last_payload, sort_keys=True)
              )
          PY

      - name: Verify control plane is isolated and reachable
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:19091/__control/state", timeout=5) as response:
              payload = json.load(response)

          assert payload["generation"] == 0, payload
          assert payload["active"] is False, payload
          PY

      - name: Verify localhost port mappings
        run: |
          docker compose port sut 8080 | grep -Fx '127.0.0.1:18080'
          docker compose port sut 9091 | grep -Fx '127.0.0.1:19091'
          docker compose port prometheus 9090 | grep -Fx '127.0.0.1:19090'

      - name: Verify only expected services are running
        run: |
          expected="$(printf '%s\n' prometheus sut)"
          actual="$(docker compose ps --status running --services | sort)"
          test "$actual" = "$expected"

      - name: Inspect pinned k6 workloads
        run: |
          make k6-inspect
          python3 - <<'PY'
          import json

          with open("runs/cf001/closed-inspect.json", encoding="utf-8") as handle:
              closed = json.load(handle)
          with open("runs/cf001/open-inspect.json", encoding="utf-8") as handle:
              opened = json.load(handle)

          assert closed["scenarios"]["closed"]["executor"] == "constant-vus", closed
          assert opened["scenarios"]["open"]["executor"] == "constant-arrival-rate", opened
          PY

      - name: Run canonical closed k6 workload
        run: make k6-closed

      - name: Run canonical open k6 workload
        run: make k6-open

      - name: Verify k6 machine-readable summaries
        run: |
          python3 - <<'PY'
          import json

          for scenario in ("closed", "open"):
              path = f"runs/cf001/{scenario}-summary.json"
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)

              assert payload["schema_version"] == 1, payload
              assert payload["scenario"] == scenario, payload
              assert isinstance(payload["signals"]["dropped_iterations"]["present"], bool), payload
              assert isinstance(payload["signals"]["dropped_iterations"]["count"], (int, float)), payload
              assert payload["signals"]["http_req_failed"] is not None, payload
              assert payload["signals"]["http_req_failed"]["rate"] == 0, payload
              assert payload["signals"]["checks"] is not None, payload
              assert payload["signals"]["checks"]["fails"] == 0, payload
              assert payload["signals"]["work_latency"] is not None, payload
              assert "p(99)" in payload["signals"]["work_latency"], payload
              assert "k6" in payload, payload
          PY
          CF001_SUMMARY_DIR="$PWD/runs/cf001" go test ./internal/cf001 -run TestGeneratedK6SummariesParse -v

      - name: Run revision-bound CF-001 experiment
        run: |
          bundle="$(go run ./cmd/cf001-runner \
            --config experiments/cf-001-coordinated-omission/experiment.yaml \
            --runs-root runs/cf-001 \
            --repo-root .)"
          test -n "$bundle"
          bundle="$(realpath "$bundle")"
          case "$bundle" in
            "$PWD"/runs/cf-001/*) ;;
            *) echo "runner returned unexpected bundle path: $bundle" >&2; exit 1 ;;
          esac
          echo "CF001_BUNDLE_DIR=$bundle" >> "$GITHUB_ENV"

      - name: Verify revision-bound CF-001 bundle
        run: |
          test -n "$CF001_BUNDLE_DIR"
          CF001_BUNDLE_DIR="$CF001_BUNDLE_DIR" go test ./internal/cf001 -run TestGeneratedRunBundleVerifies -v
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          bundle = Path(os.environ["CF001_BUNDLE_DIR"])
          manifest = json.loads((bundle / "manifest.json").read_text(encoding="utf-8"))
          revision = json.loads((bundle / "revision.json").read_text(encoding="utf-8"))

          assert manifest["revision_sha"] == os.environ["GITHUB_SHA"], manifest
          assert revision["commit"] == os.environ["GITHUB_SHA"], revision
          assert revision["dirty"] is False, revision
          assert manifest["config_sha256"], manifest
          assert len(manifest["artifacts"]) >= 10, manifest
          PY

      - name: Upload CF-001 Task 6 evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: cf001-task6-${{ github.run_id }}
          path: ${{ env.CF001_BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Dump lab diagnostics
        if: failure()
        run: |
          set +e
          echo "=== compose ps ==="
          docker compose ps --all
          echo "=== service logs ==="
          docker compose logs --no-color --tail=200 sut prometheus
          echo "=== host probes ==="
          curl -v --connect-timeout 1 --max-time 2 http://127.0.0.1:18080/healthz
          curl -v --connect-timeout 1 --max-time 2 http://127.0.0.1:19091/__control/state
          curl -v --connect-timeout 1 --max-time 2 http://127.0.0.1:19090/-/ready
          echo "=== Prometheus targets ==="
          curl --fail --silent --connect-timeout 1 --max-time 2 http://127.0.0.1:19090/api/v1/targets
          echo
          echo "=== k6 / bundle evidence files ==="
          find runs -maxdepth 5 -type f -print -exec sh -c 'echo "--- $1"; head -c 2000 "$1"; echo' _ {} \; 2>/dev/null
          echo "=== SUT container state ==="
          sut_id="$(docker compose ps -q sut)"
          if [ -n "$sut_id" ]; then
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "$sut_id"
          fi
          echo "=== Prometheus container state ==="
          prometheus_id="$(docker compose ps -q prometheus)"
          if [ -n "$prometheus_id" ]; then
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "$prometheus_id"
          fi

      - name: Tear down lab
        if: always()
        run: |
          make lab-down
          test -z "$(docker compose ps --all --quiet)"
