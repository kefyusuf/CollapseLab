services:
  sut:
    build:
      context: .
      dockerfile: sut/api/Dockerfile
    environment:
      BASE_SERVICE_TIME: "50ms"
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19091:9091"
    networks: [lab]

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:19090:9090"
    networks: [lab]

  k6:
    image: grafana/k6:2.2.0
    profiles: [tools]
    volumes:
      - ./workloads/k6:/workloads:ro
      - ./runs:/runs
    networks: [lab]

networks:
  lab:
    internal: true
